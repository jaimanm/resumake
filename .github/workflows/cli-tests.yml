name: CLI Tests

on:
  push:
    branches:
      - develop
      - 'feature/*'
      - 'bugfix/*'
      - 'fix/*'
      - 'bug/*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd src-cli && npm install
      - name: Run tests
        run: cd src-cli && npm test
