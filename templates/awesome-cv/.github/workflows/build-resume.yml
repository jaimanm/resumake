name: Build, Sync, and Release Official PDFs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Package configuration scripts generate the required TeX formats.
      - name: Install LaTeX environment
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science latexmk rclone texlive-xetex texlive-fonts-extra
          sudo fmtutil-sys --byfmt pdflatex
          sudo fmtutil-sys --byfmt xelatex

      - name: Build Official PDFs
        run: |
          chmod +x build_all.sh
          ./build_all.sh

      # ---------------------------------------------------------
      # STEP 1: SYNC TO GOOGLE DRIVE (FINDER)
      # ---------------------------------------------------------
      - name: Install and Configure rclone
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}

      - name: Verify and upload PDFs to Google Drive
        if: github.event_name == 'push'
        run: |
          test "$(find PDF_Exports -type f -name '*.pdf' | wc -l)" -eq 1
          find PDF_Exports -type f -name '*.pdf' | while IFS= read -r pdf; do
            test -s "$pdf"
            test "$(head -c 5 "$pdf")" = '%PDF-'
          done

          # Update PDFs without deleting existing destination files.
          rclone copy PDF_Exports/ gdrive:Resumes/ --checksum --verbose
          rclone check PDF_Exports/ gdrive:Resumes/ --one-way

      # ---------------------------------------------------------
      # STEP 2: HISTORICAL RELEASE (ZIP)
      # ---------------------------------------------------------
      - name: Generate Release Version
        if: github.event_name == 'push'
        id: version
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "tag=${DATE}_v${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "name=Release ${DATE} (Build ${{ github.run_number }})" >> $GITHUB_OUTPUT

      - name: Zip for Release
        if: github.event_name == 'push'
        run: zip -r Official_Resumes.zip PDF_Exports/

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          files: Official_Resumes.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
